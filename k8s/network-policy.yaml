apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: msc-de1-project
spec:
  # empty podSelector selects every pod in the namespace
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-flask-app-http
  namespace: msc-de1-project
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flask-app
      app.kubernetes.io/version: "1.0.0"
  policyTypes:
    - Ingress
  ingress:
    # no "from" means any source, but only on this port
    - ports:
        - protocol: TCP
          port: 8000
