apiVersion: v1
kind: Service
metadata:
  name: flask-app
  namespace: msc-de1-project
  labels:
    app.kubernetes.io/name: flask-app
    app.kubernetes.io/version: "1.0.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flask-app
    app.kubernetes.io/version: "1.0.0"
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
