services:
  flask-app:
    build: .
    image: abedadounkpe/msc-de1-flask-app:1.0.0
    container_name: msc-de1-flask-app
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      APP_ENV: production
      PYTHONUNBUFFERED: "1"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
